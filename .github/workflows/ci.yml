name: Luke Shop Platform Admin CI
on:
  push:
  pull_request:

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Verify source and regressions
        run: npm run verify
      - name: Theme System v1 A3 professional icon catalog guard
        run: node scripts/v0.8.0-theme-library-v1-a3-regression-test.mjs
      - name: Luke Commerce iOS v1 package guard
        run: node scripts/v0.8.0-luke-commerce-ios-v1-regression-test.mjs
      - name: Theme Navigation Composer v1 A4 package guard
        run: node scripts/v0.9.0-theme-navigation-composer-v1-a4-regression-test.mjs
      - name: Platform Icon Library v1 A1 guard
        run: node scripts/v0.9.0-platform-icon-library-v1-a1-regression-test.mjs
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org/
